<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roz-o-Shab — Daily Routine</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16233B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#16233B;
    --night-2:#1F3454;
    --dawn:#C99A44;
    --dawn-light:#E8CD98;
    --parchment:#F6F1E4;
    --parchment-2:#EEE6D2;
    --teal:#3E6E63;
    --teal-light:#DCE9E4;
    --ink:#1E2530;
    --ink-soft:#5B6472;
    --line:#DCD3BC;
    --danger:#A8452F;
    --radius:6px;
    --font-display:'Amiri', serif;
    --font-body:'Work Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--parchment);
    color:var(--ink);
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:210px;
    flex-shrink:0;
    background:var(--night);
    color:var(--parchment);
    display:flex;
    flex-direction:column;
    padding:24px 0;
  }
  .brand{
    padding:0 20px 20px 20px;
    border-bottom:1px solid rgba(246,241,228,0.15);
    margin-bottom:12px;
  }
  .brand h1{
    font-family:var(--font-display);
    font-size:26px;
    margin:0;
    color:var(--dawn-light);
    font-weight:700;
  }
  .brand p{
    margin:4px 0 0 0;
    font-size:12px;
    color:rgba(246,241,228,0.6);
  }
  nav{display:flex; flex-direction:column; gap:2px; padding:8px 10px;}
  nav button{
    display:flex;
    align-items:center;
    gap:10px;
    background:none;
    border:none;
    color:rgba(246,241,228,0.75);
    font-family:var(--font-body);
    font-size:14.5px;
    padding:10px 12px;
    border-radius:var(--radius);
    cursor:pointer;
    text-align:left;
    transition:background .15s ease, color .15s ease;
  }
  nav button:hover{ background:rgba(246,241,228,0.06); color:var(--parchment); }
  nav button.active{
    background:rgba(201,154,68,0.16);
    color:var(--dawn-light);
    border-left:2px solid var(--dawn);
    padding-left:10px;
  }
  nav .icon{ font-size:17px; width:20px; text-align:center; }
  .sidebar-foot{
    margin-top:auto;
    padding:14px 20px 0 20px;
    font-size:11px;
    color:rgba(246,241,228,0.4);
    border-top:1px solid rgba(246,241,228,0.1);
  }

  /* ---------- Main ---------- */
  main{ flex:1; padding:32px 40px; max-width:920px; }
  .page-title{
    font-family:var(--font-display);
    font-size:28px;
    margin:0 0 4px 0;
    color:var(--night);
  }
  .page-sub{ color:var(--ink-soft); font-size:14px; margin:0 0 28px 0; }

  .date-badge{
    display:inline-block;
    font-size:13px;
    color:var(--teal);
    background:var(--teal-light);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }

  /* Progress ring row */
  .stat-row{ display:flex; gap:14px; margin-bottom:26px; flex-wrap:wrap; }
  .stat{
    flex:1; min-width:130px;
    background:white;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat .num{ font-family:var(--font-display); font-size:26px; color:var(--night); }
  .stat .label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  /* Timeline */
  .period-label{
    font-size:12px;
    letter-spacing:0.03em;
    color:var(--dawn);
    font-weight:600;
    margin:22px 0 8px 2px;
  }
  .timeline{ border-left:2px solid var(--line); margin-left:6px; padding-left:0; }
  .t-item{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:10px 0 10px 22px;
    margin-left:-2px;
  }
  .t-item::before{
    content:'';
    position:absolute;
    left:-6px; top:16px;
    width:9px; height:9px;
    border-radius:50%;
    background:var(--line);
    border:2px solid var(--parchment);
  }
  .t-item.done::before{ background:var(--teal); }
  .t-time{ width:64px; flex-shrink:0; font-size:12.5px; color:var(--ink-soft); padding-top:2px; }
  .t-body{ flex:1; }
  .t-name{ font-size:14.5px; font-weight:500; }
  .t-item.done .t-name{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }
  .t-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .t-check{
    width:26px; height:26px; border-radius:50%;
    border:1.5px solid var(--line);
    background:white;
    cursor:pointer;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    color:transparent;
    transition:all .15s ease;
  }
  .t-item.done .t-check{ background:var(--teal); border-color:var(--teal); color:white; }
  .t-del{ background:none; border:none; color:var(--line); cursor:pointer; font-size:15px; padding:0 4px; }
  .t-del:hover{ color:var(--danger); }

  /* Buttons & forms */
  .btn{
    font-family:var(--font-body);
    font-size:13.5px;
    font-weight:600;
    padding:9px 16px;
    border-radius:var(--radius);
    border:1px solid var(--night);
    background:var(--night);
    color:var(--parchment);
    cursor:pointer;
  }
  .btn:hover{ background:var(--night-2); }
  .btn.secondary{ background:white; color:var(--night); border-color:var(--line); }
  .btn.secondary:hover{ background:var(--parchment-2); }
  .btn.small{ padding:5px 10px; font-size:12px; }
  input, select{
    font-family:var(--font-body);
    font-size:13.5px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:white;
    color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--dawn-light); outline-offset:0; border-color:var(--dawn); }
  label.field-label{ font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px; }

  .card{
    background:white;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card h3{ margin:0 0 12px 0; font-size:16px; font-family:var(--font-display); color:var(--night); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .row > div{ display:flex; flex-direction:column; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td{ padding:8px; border-bottom:1px solid var(--parchment-2); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }

  .tag{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--parchment-2); color:var(--ink-soft); }
  .tag.low{ background:#F5DED6; color:var(--danger); }
  .tag.ok{ background:var(--teal-light); color:var(--teal); }

  .day-tabs{ display:flex; gap:4px; margin-bottom:16px; flex-wrap:wrap; }
  .day-tabs button{
    font-family:var(--font-body); font-size:12.5px; padding:6px 12px;
    border:1px solid var(--line); background:white; border-radius:20px; cursor:pointer; color:var(--ink-soft);
  }
  .day-tabs button.active{ background:var(--night); color:var(--parchment); border-color:var(--night); }

  .meal-slot{ display:flex; flex-direction:column; gap:3px; padding:10px 0; border-bottom:1px solid var(--parchment-2); }
  .meal-slot:last-child{ border-bottom:none; }
  .meal-slot .k{ font-size:11.5px; color:var(--dawn); font-weight:600; }
  .empty-note{ font-size:13px; color:var(--ink-soft); font-style:italic; }

  .water-track{ display:flex; align-items:center; gap:14px; margin-top:6px; }
  .water-bar{ flex:1; height:12px; background:var(--parchment-2); border-radius:20px; overflow:hidden; }
  .water-fill{ height:100%; background:var(--teal); transition:width .3s ease; }

  .checklist-item{ display:flex; align-items:center; gap:10px; padding:6px 0; }
  .checklist-item input[type=checkbox]{ width:16px; height:16px; }

  .shop-item{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--parchment-2); }
  .shop-item:last-child{ border-bottom:none; }
  .shop-item.checked .name{ text-decoration:line-through; color:var(--ink-soft); }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--night); color:var(--parchment); font-size:13px;
    padding:10px 18px; border-radius:20px; opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:50;
  }
  .toast.show{ opacity:1; }

  @media (max-width:760px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; overflow-x:auto; padding:12px; }
    .brand{ display:none; }
    nav{ flex-direction:row; padding:0; }
    nav button.active{ border-left:none; border-bottom:2px solid var(--dawn); padding-left:12px; }
    .sidebar-foot{ display:none; }
    main{ padding:20px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">
      <h1>روز و شب</h1>
      <p>Roz-o-Shab · Daily Routine</p>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">Fajr se Isha tak, ek nazar mein.</div>
  </div>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============ Storage helpers ============ */
async function sget(key, fallback){
  try{
    const r = await window.storage.get(key);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function sset(key, value){
  try{ await window.storage.set(key, JSON.stringify(value)); }catch(e){ console.error('storage set failed', key, e); }
}
function todayKey(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function todayLabel(){
  return new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long' });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============ Defaults ============ */
const DEFAULT_SETTINGS = {
  officeStart:'06:30', officeEnd:'17:30',
  fajr:'05:00', dhuhr:'12:30', asr:'16:00', maghrib:'18:45', isha:'20:00',
  sleepTarget:'23:00', waterTargetMl:2500
};

const DEFAULT_SCHEDULE = [
  {id:uid(), time:'05:00', label:'Fajr', emoji:'🕌', category:'namaz'},
  {id:uid(), time:'05:15', label:'Quran / personal time', emoji:'📖', category:'personal'},
  {id:uid(), time:'05:45', label:'Ready hona', emoji:'🚿', category:'personal'},
  {id:uid(), time:'06:00', label:'Office ke liye nikalna', emoji:'🚗', category:'commute'},
  {id:uid(), time:'06:30', label:'Office start', emoji:'🏢', category:'work'},
  {id:uid(), time:'09:30', label:'Tea + snack', emoji:'☕', category:'food'},
  {id:uid(), time:'12:30', label:'Lunch', emoji:'🍛', category:'food'},
  {id:uid(), time:'13:00', label:'Short rest', emoji:'😴', category:'rest'},
  {id:uid(), time:'13:30', label:'Office work', emoji:'💼', category:'work'},
  {id:uid(), time:'15:30', label:'Tea / snack', emoji:'☕', category:'food'},
  {id:uid(), time:'17:30', label:'Office end', emoji:'🏢', category:'work'},
  {id:uid(), time:'18:00', label:'Ghar / commute', emoji:'🚗', category:'commute'},
  {id:uid(), time:'18:45', label:'Maghrib', emoji:'🕌', category:'namaz'},
  {id:uid(), time:'19:30', label:'Gym', emoji:'🏋️', category:'gym'},
  {id:uid(), time:'20:00', label:'Isha', emoji:'🕌', category:'namaz'},
  {id:uid(), time:'20:30', label:'Dinner', emoji:'🍽️', category:'food'},
  {id:uid(), time:'21:30', label:'Relax', emoji:'🧘', category:'rest'},
  {id:uid(), time:'22:30', label:'Sleep preparation', emoji:'🌙', category:'rest'},
  {id:uid(), time:'23:00', label:'Sleep', emoji:'😴', category:'rest'},
];

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

/* ============ Global state ============ */
let state = {
  settings: null,
  schedule: null,
  dailyLog: null,      // {itemId: bool, water: ml}
  mealPlan: null,       // {day:{breakfast,lunch,dinner}}
  inventory: null,      // [{id,name,qty,unit,min,category}]
  shoppingList: null,   // [{id,name,checked,auto}]
  gymPlan: null,        // {day:[{id,exercise,sets,reps}]}
  gymLog: null          // {dateKey: bool}
};

async function loadAll(){
  state.settings = await sget('settings', DEFAULT_SETTINGS);
  state.schedule = await sget('schedule', DEFAULT_SCHEDULE);
  state.dailyLog = await sget('log:'+todayKey(), {});
  state.mealPlan = await sget('meal-plan', {});
  state.inventory = await sget('inventory', []);
  state.shoppingList = await sget('shopping-list', []);
  state.gymPlan = await sget('gym-plan', {});
  state.gymLog = await sget('gym-log', {});
}

/* ============ Nav ============ */
const TABS = [
  {id:'home', icon:'🏠', label:'Home'},
  {id:'routine', icon:'🕐', label:'Routine'},
  {id:'meals', icon:'🍽️', label:'Meals'},
  {id:'inventory', icon:'🧊', label:'Inventory'},
  {id:'shopping', icon:'🛒', label:'Shopping'},
  {id:'health', icon:'🏋️', label:'Health'},
  {id:'reports', icon:'📊', label:'Reports'},
  {id:'settings', icon:'⚙️', label:'Settings'},
];
let activeTab = 'home';

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = t.id===activeTab ? 'active' : '';
    b.innerHTML = `<span class="icon">${t.icon}</span><span>${t.label}</span>`;
    b.onclick = ()=>{ activeTab = t.id; render(); };
    nav.appendChild(b);
  });
}

/* ============ Time helpers ============ */
function toMinutes(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function fromMinutes(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmt12(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  const ampm = h>=12 ? 'PM' : 'AM';
  let hh = h%12; if(hh===0) hh=12;
  return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
}
function periodOf(hhmm){
  const m = toMinutes(hhmm);
  if(m < 11*60+30) return '🌅 Morning';
  if(m < 17*60) return '☀️ Afternoon';
  if(m < 20*60) return '🌆 Evening';
  return '🌙 Night';
}

/* Rough cook-time estimate by simple keyword lookup, minutes */
function cookTimeFor(mealName){
  if(!mealName) return 30;
  const n = mealName.toLowerCase();
  if(n.includes('biryani')) return 75;
  if(n.includes('daal') || n.includes('dal')) return 35;
  if(n.includes('salad')) return 10;
  if(n.includes('egg')) return 10;
  if(n.includes('bbq') || n.includes('grill')) return 40;
  if(n.includes('rice')) return 45;
  return 30;
}

/* ============ RENDER ROOT ============ */
function render(){
  renderNav();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(activeTab==='home') renderHome(main);
  else if(activeTab==='routine') renderRoutine(main);
  else if(activeTab==='meals') renderMeals(main);
  else if(activeTab==='inventory') renderInventory(main);
  else if(activeTab==='shopping') renderShopping(main);
  else if(activeTab==='health') renderHealth(main);
  else if(activeTab==='reports') renderReports(main);
  else if(activeTab==='settings') renderSettings(main);
}

/* ============ HOME ============ */
function renderHome(main){
  const sched = [...state.schedule].sort((a,b)=>toMinutes(a.time)-toMinutes(b.time));
  const doneCount = sched.filter(i=>state.dailyLog[i.id]).length;
  const namazItems = sched.filter(i=>i.category==='namaz');
  const namazDone = namazItems.filter(i=>state.dailyLog[i.id]).length;
  const water = state.dailyLog.water || 0;
  const target = state.settings.waterTargetMl;
  const score = sched.length ? Math.round((doneCount/sched.length)*100) : 0;

  main.innerHTML = `
    <div class="date-badge">${todayLabel()}</div>
    <h2 class="page-title">Aaj ka Din</h2>
    <p class="page-sub">Har activity ke saamne tick karein jaise woh mukammal ho.</p>
    ${Notification && Notification.permission !== 'granted' ? `
      <div class="card" style="background:var(--teal-light); border-color:var(--teal);">
        <strong>🔔 Reminders abhi band hain.</strong>
        <p class="t-sub" style="margin:6px 0 10px 0">Notifications on karein taake namaz, khana aur gym ke waqt par yaad dihani mile — jab tak app khuli/background mein ho.</p>
        <button class="btn small" id="home-enable-notif">Notifications On Karein</button>
      </div>
    ` : ''}

    <div class="stat-row">
      <div class="stat"><div class="num">${score}%</div><div class="label">Daily Score</div></div>
      <div class="stat"><div class="num">${namazDone}/${namazItems.length}</div><div class="label">Namaz</div></div>
      <div class="stat"><div class="num">${(water/1000).toFixed(1)}L</div><div class="label">Pani (target ${(target/1000).toFixed(1)}L)</div></div>
      <div class="stat"><div class="num">${doneCount}/${sched.length}</div><div class="label">Activities Done</div></div>
    </div>

    <div id="home-timeline"></div>
  `;

  const enableBtn = document.getElementById('home-enable-notif');
  if(enableBtn) enableBtn.onclick = requestNotifPermission;

  const tl = document.getElementById('home-timeline');
  let lastPeriod = '';
  sched.forEach(item=>{
    const p = periodOf(item.time);
    if(p !== lastPeriod){
      const lbl = document.createElement('div');
      lbl.className = 'period-label';
      lbl.textContent = p;
      tl.appendChild(lbl);
      lastPeriod = p;
      const wrap = document.createElement('div');
      wrap.className = 'timeline';
      wrap.dataset.period = p;
      tl.appendChild(wrap);
    }
    const wrap = tl.querySelector(`.timeline:last-of-type`);
    const done = !!state.dailyLog[item.id];
    const row = document.createElement('div');
    row.className = 't-item' + (done ? ' done' : '');
    let sub = '';
    if(item.category==='food'){
      const dayName = DAYS[(new Date().getDay()+6)%7];
      const plan = state.mealPlan[dayName] || {};
      let mealKey = item.label.toLowerCase().includes('lunch') ? 'lunch' : item.label.toLowerCase().includes('dinner') ? 'dinner' : null;
      if(mealKey && plan[mealKey]){
        sub = `Aaj: ${plan[mealKey]}`;
      }
    }
    row.innerHTML = `
      <div class="t-time">${fmt12(item.time)}</div>
      <button class="t-check">✓</button>
      <div class="t-body">
        <div class="t-name">${item.emoji} ${item.label}</div>
        ${sub ? `<div class="t-sub">${sub}</div>` : ''}
      </div>
    `;
    row.querySelector('.t-check').onclick = async ()=>{
      state.dailyLog[item.id] = !state.dailyLog[item.id];
      await sset('log:'+todayKey(), state.dailyLog);
      render();
    };
    wrap.appendChild(row);
  });
}

/* ============ ROUTINE (schedule editor) ============ */
function renderRoutine(main){
  main.innerHTML = `
    <h2 class="page-title">Routine</h2>
    <p class="page-sub">Apna poora din yahan customize karein — time, activity aur emoji.</p>
    <div class="card">
      <h3>Nayi Activity Add Karein</h3>
      <div class="row">
        <div><label class="field-label">Time</label><input type="time" id="r-time" value="12:00"></div>
        <div><label class="field-label">Activity</label><input type="text" id="r-label" placeholder="e.g. Car wash"></div>
        <div><label class="field-label">Emoji</label><input type="text" id="r-emoji" placeholder="🧹" style="width:60px" maxlength="4"></div>
        <div><label class="field-label">Category</label>
          <select id="r-cat">
            <option value="namaz">Namaz</option>
            <option value="food">Khana</option>
            <option value="work">Work</option>
            <option value="gym">Gym</option>
            <option value="rest">Rest</option>
            <option value="personal">Personal</option>
            <option value="commute">Commute</option>
            <option value="custom">Custom</option>
          </select>
        </div>
        <div><button class="btn" id="r-add">+ Add Activity</button></div>
      </div>
    </div>
    <div class="card">
      <h3>Poora Schedule</h3>
      <table id="r-table"></table>
    </div>
  `;

  const tbl = document.getElementById('r-table');
  const sorted = [...state.schedule].sort((a,b)=>toMinutes(a.time)-toMinutes(b.time));
  tbl.innerHTML = `<tr><th>Time</th><th>Activity</th><th>Category</th><th></th></tr>` +
    sorted.map(i=>`
      <tr>
        <td>${fmt12(i.time)}</td>
        <td>${i.emoji} ${i.label}</td>
        <td><span class="tag">${i.category}</span></td>

  document.getElementById('r-add').onclick = async ()=>{

    state.schedule.push({id:uid(), time, label, emoji, category});
    await sset('schedule', state.schedule);
    toast('Activity add ho gayi');
    render();
  };
}

/* ============ MEALS ============ */

  const tabs = document.getElementById('day-tabs');
  DAYS.forEach(d=>{
    const b = document.createElement('button');
    b.textContent = d.slice(0,3);
    b.className = d===activeMealDay ? 'active' : '';
    b.onclick = ()=>{ activeMealDay = d; renderMeals(main); };

  const plan = state.mealPlan[activeMealDay] || {breakfast:'', lunch:'', dinner:''};

    <h3>${activeMealDay} ka Plan</h3>

      <div><label class="field-label">Dinner</label><input type="text" id="m-dinner" value="${plan.dinner||''}" placeholder="e.g. Daal + Roti"></div>
      <div><button class="btn" id="m-save">Save Plan</button></div>
    </div>
  `;
  document.getElementById('m-save').onclick = async ()=>{
    state.mealPlan[activeMealDay] = {
      breakfast: document.getElementById('m-breakfast').value.trim(),
      lunch: document.getElementById('m-lunch').value.trim(),
      dinner: document.getElementById('m-dinner').value.trim(),
    };
    await sset('meal-plan', state.mealPlan);
    toast('Meal plan saved');
    renderMeals(main);
  };

  // cooking timeline based on lunch/dinner times in schedule
  const ct = document.getElementById('cook-timeline');
  const lunchItem = state.schedule.find(i=>i.label.toLowerCase().includes('lunch'));
  const dinnerItem = state.schedule.find(i=>i.label.toLowerCase().includes('dinner'));

  [['Lunch', plan.lunch, lunchItem], ['Dinner', plan.dinner, dinnerItem]].forEach(([label, meal, item])=>{

    if(!item){ html += `<p class="empty-note">${label} ka schedule time nahi mila.</p>`; return; }

      <div class="meal-slot">

/* ============ INVENTORY ============ */

        <div><label class="field-label">Unit</label><input type="text" id="i-unit" style="width:80px" placeholder="kg / pcs / L"></div>

  tbl.innerHTML = `<tr><th>Item</th><th>Quantity</th><th>Min</th><th>Status</th><th></th></tr>` +
    state.inventory.map(item=>{
      const low = item.qty <= item.min;
      return `<tr>
        <td>${item.name}</td>
        <td><input type="number" class="i-qty-edit" data-id="${item.id}" value="${item.qty}" style="width:70px"> ${item.unit||''}</td>

        <td><span class="tag ${low?'low':'ok'}">${low?'Low — reorder':'OK'}</span></td>
        <td><button class="t-del" data-id="${item.id}">✕</button></td>
      </tr>`;
    }).join('');

  tbl.querySelectorAll('.i-qty-edit').forEach(inp=>{
    inp.onchange = async ()=>{
      const item = state.inventory.find(i=>i.id===inp.dataset.id);
      item.qty = Number(inp.value);
      await sset('inventory', state.inventory);
      await syncShoppingFromInventory();
      renderInventory(main);
    };
  });
  tbl.querySelectorAll('.t-del').forEach(btn=>{
    btn.onclick = async ()=>{
      state.inventory = state.inventory.filter(i=>i.id!==btn.dataset.id);
      await sset('inventory', state.inventory);
      renderInventory(main);
    };
  });

  document.getElementById('i-add').onclick = async ()=>{
    const name = document.getElementById('i-name').value.trim();
    if(!name){ toast('Item ka naam likhein'); return; }
    const qty = Number(document.getElementById('i-qty').value)||0;
    const unit = document.getElementById('i-unit').value.trim();
    const min = Number(document.getElementById('i-min').value)||0;
    state.inventory.push({id:uid(), name, qty, unit, min});
    await sset('inventory', state.inventory);
    await syncShoppingFromInventory();
    toast('Item added');
    renderInventory(main);
  };
}

async function syncShoppingFromInventory(){
  state.inventory.forEach(item=>{
    const exists = state.shoppingList.find(s=>s.autoFor===item.id);
    const low = item.qty <= item.min;
    if(low && !exists){
      state.shoppingList.push({id:uid(), name:item.name, checked:false, auto:true, autoFor:item.id});
    }
    if(!low && exists && !exists.checked){
      state.shoppingList = state.shoppingList.filter(s=>s.id!==exists.id);
    }
  });
  await sset('shopping-list', state.shoppingList);
}

}

/* ============ Notifications ============ */
let swRegistration = null;

async function registerServiceWorker(){
  if('serviceWorker' in navigator){
    try{
      swRegistration = await navigator.serviceWorker.register('service-worker.js');
    }catch(e){ console.warn('Service worker registration failed', e); }
  }
}

async function requestNotifPermission(){
  if(!('Notification' in window)){ toast('Ye browser notifications support nahi karta'); return; }
  const perm = await Notification.requestPermission();
  if(perm === 'granted'){
    toast('Notifications on ho gaye');
    fireNotification('🔔 Roz-o-Shab', 'Reminders ab active hain.');
  } else {
    toast('Permission nahi mili');
  }
  render();
}

function fireNotification(title, body){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  if(swRegistration && swRegistration.active){
    swRegistration.active.postMessage({ type:'SHOW_NOTIFICATION', payload:{ title, body } });
  } else {
    try{ new Notification(title, { body, icon:'icon-192.png' }); }catch(e){ /* ignore */ }
  }
}

// Tracks which schedule-item IDs have already fired today, to avoid repeats.
async function getNotifiedSet(){
  return await sget('notified:'+todayKey(), {});
}
async function markNotified(id){
  const set = await getNotifiedSet();
  set[id] = true;
  await sset('notified:'+todayKey(), set);
}

async function checkReminders(){
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  const now = new Date();
  const nowHHMM = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const notified = await getNotifiedSet();

  for(const item of state.schedule){
    if(item.time === nowHHMM && !notified[item.id]){
      let body = 'Waqt ho gaya hai.';
      if(item.category === 'namaz') body = 'Namaz ka waqt ho gaya hai.';
      if(item.category === 'food'){
        const dayName = DAYS[(new Date().getDay()+6)%7];
        const plan = state.mealPlan[dayName] || {};
        const key = item.label.toLowerCase().includes('lunch') ? 'lunch' : item.label.toLowerCase().includes('dinner') ? 'dinner' : item.label.toLowerCase().includes('breakfast') ? 'breakfast' : null;
        if(key && plan[key]) body = 'Aaj: ' + plan[key];
      }
      fireNotification(`${item.emoji} ${item.label}`, body);
      await markNotified(item.id);
    }

    // 15-min-before cooking reminder for lunch/dinner
    if((item.label.toLowerCase().includes('lunch') || item.label.toLowerCase().includes('dinner'))){
      const dayName = DAYS[(new Date().getDay()+6)%7];
      const plan = state.mealPlan[dayName] || {};
      const key = item.label.toLowerCase().includes('lunch') ? 'lunch' : 'dinner';
      const meal = plan[key];
      if(meal){
        const cookMin = cookTimeFor(meal);
        const cookAt = fromMinutes(toMinutes(item.time) - cookMin);
        const cookId = item.id + ':cook';
        if(cookAt === nowHHMM && !notified[cookId]){
          fireNotification('👨‍🍳 Cooking ka waqt', `${meal} — ${item.label} ${fmt12(item.time)} par hai.`);
          await markNotified(cookId);
        }
      }
    }
  }
}

/* ============ INIT ============ */
(async function init(){
  document.getElementById('main').innerHTML = '<p class="page-sub">Loading…</p>';
  await registerServiceWorker();
  await loadAll();
  await syncShoppingFromInventory();
  render();
  setInterval(checkReminders, 20000);
  checkReminders();
})();
</script>
